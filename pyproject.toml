[project]
name = "legion-control"
version = "0.5.0"
description = "Native Linux controls for supported Lenovo Legion laptops"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "ulrickpsp" },
]
keywords = ["Lenovo", "Legion", "Linux", "fan-control", "RGB"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ulrickpsp/legion-control-linux"
Issues = "https://github.com/ulrickpsp/legion-control-linux/issues"
Source = "https://github.com/ulrickpsp/legion-control-linux"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
